  /* ============ tokens ============ */
  :root {
    --ink:      #26303A;   /* charcoal — lines & text */
    --ink-soft: #5B6772;   /* muted labels */
    --pencil:   #FFC81E;   /* HB pencil yellow — the one accent */
    --pencil-deep: #E8B200;
    --grid:     #D9E6F2;   /* Karopapier blue */
    --desk:     #FAFBFA;
    --paper:    #FFFFFF;
    --given:    #F3F3F0;   /* fill of the pre-printed model square */
    --line:     #D5DAE0;   /* UI input borders */
    /* Schmuck — garden pastels (sticker fills, outline stays --ink) */
    --deko-green:  #BFE3B4;
    --deko-blue:   #BBDDF2;
    --deko-yellow: #FFE08A;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    /* the desk is squared paper — the app lives in the child's notebook */
    background-color: var(--desk);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
  }

  .app {
    display: flex;
    align-items: flex-start;
    gap: 32px;
    padding: 32px;
    max-width: 1280px;
    margin: 0 auto;
  }

  /* ============ sidebar (parent UI) ============ */
  .sidebar {
    flex: 0 0 300px;
    position: sticky;
    top: 32px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 2px 10px rgba(38, 48, 58, .06);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .brand svg { flex: 0 0 auto; }
  .brand h1 {
    font-family: "Pacifico", "Blattschrift", system-ui, sans-serif;
    font-weight: 400;
    font-size: 34px;
    margin: 0;
    letter-spacing: .5px;
  }

  .field { margin-bottom: 14px; }
  .field > label, .field .field-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--ink-soft);
    margin-bottom: 5px;
  }
  .field input, .field select {
    width: 100%;
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    padding: 8px 10px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    background: var(--paper);
  }
  .field input:focus-visible, .field select:focus-visible,
  button:focus-visible {
    outline: 3px solid var(--pencil);
    outline-offset: 1px;
  }

  /* optional note under a field — only shown when the template has something to say */
  .field-hint {
    display: none;
    margin-top: 5px;
    font-size: 12px;
    line-height: 1.35;
    color: var(--ink-soft);
  }
  .field-hint.show { display: block; }

  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }

  /* Schalter-Chips (Groß/Klein) — dieselbe Mechanik wie die Vorlagen-Karten:
     das Kästchen bleibt fokussierbar und unsichtbar, sichtbar ist der Chip daneben. */
  .toggle-row { display: flex; gap: 10px; }
  .toggle { position: relative; flex: 1; cursor: pointer; }
  .toggle input { position: absolute; top: 0; left: 0; opacity: 0; pointer-events: none; }
  .toggle-chip {
    display: block;
    font-family: "Blattschrift", system-ui, sans-serif;
    font-size: 19px;
    font-weight: 700;
    text-align: center;
    color: var(--ink);
    padding: 6px 10px;
    border: 2px solid var(--line);
    border-radius: 10px;
    background: var(--paper);
    transition: border-color .15s ease, background .15s ease;
  }
  .toggle:hover .toggle-chip { border-color: var(--ink-soft); }
  /* an = der Chip ist gefüllt; der letzte aktive ist gesperrt und bleibt einfach an */
  .toggle input:checked + .toggle-chip { border-color: var(--ink); background: var(--deko-blue); }
  .toggle input:focus-visible + .toggle-chip {
    outline: 3px solid var(--pencil);
    outline-offset: 1px;
  }

  /* Vorlage picker — a sheet of stickers; the glyph is what the child practices.
     Native radios (hidden, still focusable) keep keyboard + reader semantics. */
  .tpl-cards {
    position: relative;   /* containing block for the hidden radios */
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .tpl-cards input[type="radio"] {
    position: absolute;
    top: 0;
    left: 0;
    opacity: 0;
    pointer-events: none;
  }
  .tpl-card {
    --card-fill: var(--deko-yellow);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 5px;
    padding: 10px 6px 8px;
    background: var(--paper);
    border: 2px solid var(--line);
    border-radius: 12px;
    cursor: pointer;
    text-align: center;
    transition: border-color .15s ease, background .15s ease, transform .15s ease;
  }
  .tpl-card:hover { border-color: var(--ink-soft); transform: translateY(-1px); }
  .tpl-glyph {
    font-family: "Blattschrift", system-ui, sans-serif;
    font-size: 21px;
    font-weight: 700;
    line-height: 1.25;
    padding: 1px 10px;
    background: var(--card-fill);
    border: 1.5px solid var(--ink);
    border-radius: 8px;
  }
  .tpl-name {
    font-size: 12px;
    line-height: 1.25;
    color: var(--ink);
  }
  /* picked = the sticker is applied: pastel fill + ink outline (yellow stays actions-only) */
  input:checked + .tpl-card {
    border-color: var(--ink);
    background: var(--card-fill);
  }
  input:checked + .tpl-card .tpl-glyph { background: var(--paper); }
  input:focus-visible + .tpl-card {
    outline: 3px solid var(--pencil);
    outline-offset: 1px;
  }

  .tpl-desc {
    font-size: 13px;
    color: var(--ink-soft);
    margin: -6px 0 16px;
    line-height: 1.45;
  }

  .divider { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }

  /* the one loud thing in the sidebar — a fat yellow sticker you press */
  .btn-print {
    width: 100%;
    font: inherit;
    font-size: 17px;
    font-weight: 700;
    color: var(--ink);
    background: var(--pencil);
    border: 2px solid var(--ink);
    border-radius: 999px;
    padding: 12px;
    cursor: pointer;
    box-shadow: 0 2px 0 var(--ink);
    transition: background .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .btn-print:hover { background: var(--pencil-deep); transform: translateY(-1px); box-shadow: 0 3px 0 var(--ink); }
  .btn-print:active { transform: translateY(1px); box-shadow: 0 1px 0 var(--ink); }

  .hint {
    font-size: 12px;
    color: var(--ink-soft);
    margin: 12px 0 0;
    line-height: 1.5;
  }

  .deko-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .deko-check {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 14px;
    cursor: pointer;
  }
  .deko-check input { accent-color: var(--pencil-deep); width: 16px; height: 16px; }
  .btn-dice {
    font: inherit;
    font-size: 13px;
    color: var(--ink);
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 10px;
    padding: 6px 10px;
    cursor: pointer;
    transition: transform .15s ease, background .15s ease;
  }
  .btn-dice:hover:enabled { background: var(--deko-blue); transform: rotate(-2deg); }
  .btn-dice:disabled { opacity: .45; cursor: default; border-color: var(--line); }

  .warn {
    display: none;
    font-size: 13px;
    background: #FBEAE7;
    border: 1px solid #E4A69C;
    border-radius: 8px;
    padding: 9px 11px;
    margin-top: 12px;
    line-height: 1.45;
  }
  .warn.show { display: block; }

  /* ============ the sheet (child's world, true A4) ============ */
  .stage { flex: 1; min-width: 0; }

  .sheet-scaler { transform-origin: top left; }

  .sheet {
    position: relative;   /* anchor for the Schmuck layer */
    /* geometry is per Vorlage: the shell writes --sheet-* from tpl.page, A4 is the
       default. Everything downstream (Schmuck, overflow guard, preview) reads the
       live box, so a Vorlage on another paper size needs no further change. */
    --sheet-w: 210mm;
    --sheet-h: 285mm;
    --sheet-pad: 12mm;
    width: var(--sheet-w);
    /* the physical page height minus a 12mm reserve at the bottom: iOS Safari's
       AirPrint injects its own footer (site name + URL) into the printout with no way
       to disable it, and since the sheet always floors to a full page, that footer had
       nowhere to go but push the last sliver of content onto a second page. Same
       category as the printer-clip-zone safe-inset below, just sized for the OS band. */
    min-height: var(--sheet-h);
    padding: var(--sheet-pad);
    background: var(--paper);
    box-shadow: 0 4px 24px rgba(38, 48, 58, .14);
    border-radius: 2px;
  }
  /* Zwei-auf-eins: one physical A4 landscape carrier holding two A5 cards side by side,
     with a dashed cut line down the middle. The carrier is the print unit, the card stays
     the unit everything else (Schmuck, overflow guard, ctx) reasons about. */
  .carrier {
    position: relative;
    display: flex;
    align-items: flex-start;   /* cards keep their own height — stretch would break the guard */
    background: var(--paper);
    box-shadow: 0 4px 24px rgba(38, 48, 58, .14);
    border-radius: 2px;
  }
  .carrier .sheet { box-shadow: none; border-radius: 0; }
  .cut-line {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    border-left: 0.3mm dashed rgba(38, 48, 58, .38);
    pointer-events: none;
  }

  /* stacked multi-page preview — screen only, print paginates via break-after instead */
  @media screen {
    .sheet-scaler > .sheet + .sheet,
    .carrier + .carrier { margin-top: 10mm; }
  }

  /* Schmuck — decoration layer, always behind and out of the content flow */
  .deko {
    position: absolute;
    inset: 0;
    pointer-events: none;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .deko-footer {
    position: absolute;
    left: var(--sheet-pad);
    bottom: 7mm;
    width: calc(var(--sheet-w) - 2 * var(--sheet-pad));
  }
  .deko-title-motif { flex: 0 0 auto; }

  .sheet-head {
    display: flex;
    align-items: flex-end;
    gap: 12mm;
    font-family: "Blattschrift", system-ui, sans-serif;
    font-size: 13pt;
  }
  .write-line {
    display: flex;
    align-items: flex-end;
    gap: 3mm;
  }
  .write-line .rule {
    border-bottom: 0.4mm solid var(--ink);
    height: 9mm;
  }
  .write-name { flex: 1; }
  .write-name .rule { flex: 1; }
  .write-date .rule { width: 42mm; }

  .sheet-title {
    font-family: "Blattschrift", system-ui, sans-serif;
    font-size: 21pt;
    text-align: center;
    margin: 7mm 0 8mm;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4mm;
  }

  /* rows of Kästchen — friendly rounded strips, shared inner borders */
  .rows { display: flex; flex-direction: column; align-items: center; }
  .row  { display: flex; }
  .cell {
    border: 0.3mm solid var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Blattschrift", system-ui, sans-serif;
  }
  .cell + .cell { border-left: none; }
  .row .cell:first-child { border-radius: 1.5mm 0 0 1.5mm; }
  .row .cell:last-child  { border-radius: 0 1.5mm 1.5mm 0; }
  .cell-model {
    background: var(--given);
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* Rechenaufgaben — 2-spaltiges Raster, Ergebnis-Kästchen bündig rechts */
  .aufgaben {
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 16mm;
    row-gap: 6mm;
  }
  .aufgabe {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 4mm;
    font-family: "Blattschrift", system-ui, sans-serif;
    font-size: 9mm;
    white-space: nowrap;
  }
  .aufgabe .cell { border-radius: 1.5mm; }

  /* Sudoku — ein Grid aus Kästchen; dick sind nur Blockgrenzen und Außenrahmen.
     Die Zellgröße setzt die Vorlage aus dem Papier (--sdk-cell), die Ziffern
     skalieren mit ihr mit. */
  .sudoku-wrap { display: flex; flex-direction: column; align-items: center; }
  .sudoku-stars {
    font-size: 15pt;
    letter-spacing: 1.2mm;
    margin: -5mm 0 7mm;             /* rückt direkt unter den Titel */
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .sudoku {
    display: grid;
    border: 0.8mm solid var(--ink);
    border-radius: 1.5mm;
    overflow: hidden;
  }
  .sdk-cell {
    width: var(--sdk-cell);
    height: var(--sdk-cell);
    border-right: 0.25mm solid var(--ink);
    border-bottom: 0.25mm solid var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Blattschrift", system-ui, sans-serif;
    font-size: calc(var(--sdk-cell) * .6);
    line-height: 1;
  }
  .sdk-block-r { border-right-width: 0.7mm; }
  .sdk-block-b { border-bottom-width: 0.7mm; }
  .sdk-edge-r  { border-right: none; }
  .sdk-edge-b  { border-bottom: none; }
  .sdk-given {
    background: var(--given);        /* vorgegebene Zahlen getont — wie .cell-model */
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* Lesen — nackte Sätze, nichts drumherum; Abstände in em, damit die Zeilen
     mit der Schriftgröße mitwachsen */
  .satz-list {
    display: flex;
    flex-direction: column;
    gap: .7em;
    padding-left: 8mm;          /* nicht am Rand kleben */
    font-family: "Blattschrift", system-ui, sans-serif;
    line-height: 1.35;
  }

  /* ============ print ============ */
  /* the paper size follows the active Vorlage — the shell rewrites #page-rule below.
     This stays as the A4 fallback for the moment before the first render. */
  @page { size: A4 portrait; margin: 0; }

  @media print {
    body { background: none; }
    .app { display: block; padding: 0; max-width: none; }
    .sidebar { display: none; }
    .sheet-scaler { transform: none !important; height: auto !important; }
    .sheet { box-shadow: none; border-radius: 0; margin: 0; }
    /* each top-level unit is its own physical page; no break after the last one.
       Scoped to direct children so the two cards inside a carrier do NOT break apart. */
    .sheet-scaler > .sheet:not(:last-child),
    .carrier:not(:last-child) { break-after: page; page-break-after: always; }
    .carrier { box-shadow: none; border-radius: 0; margin: 0; }
  }

  /* ============ micro-moments (screen only, motion-safe) ============ */
  @media screen and (prefers-reduced-motion: no-preference) {
    .sheet { animation: sheet-settle .3s ease-out; }
    @keyframes sheet-settle {
      from { opacity: 0; transform: translateY(3px); }
    }
    input:checked + .tpl-card { animation: card-pop .25s ease; }
    @keyframes card-pop {
      50% { transform: scale(1.05); }
    }
    .btn-dice.rolling { animation: dice-roll .45s ease; }
    @keyframes dice-roll {
      25% { transform: rotate(-14deg); }
      60% { transform: rotate(10deg); }
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  /* ============ phone (parent prints from the iPhone) ============ */
  @media screen and (max-width: 800px) {
    .app {
      flex-direction: column;   /* controls first, sheet below */
      align-items: stretch;     /* let the stage take the viewport width, not the A4 width */
      gap: 20px;
      padding: 16px;
    }
    .sidebar {
      position: static;
      flex: 0 0 auto;
      width: 100%;
    }
    /* the scaled A4 keeps its layout width — clip it so the page can't pan sideways */
    .stage { overflow-x: hidden; }
    /* touch sizing; 16px inputs also stop iOS focus-zoom */
    .field input, .field select { font-size: 16px; padding: 11px 12px; }
    .tpl-card { min-height: 72px; }
    .btn-dice { padding: 12px 14px; }
    .btn-print { padding: 14px; }
    .deko-check input { width: 20px; height: 20px; }
  }
</style>
<style id="page-rule"></style>
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <!-- pencil mark -->
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <circle cx="15" cy="15" r="14" fill="var(--pencil)"/>
        <path d="M9.5 20.5 L10.5 16.5 L18.5 8.5 L22 12 L14 20 L9.5 20.5 Z"
              fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      <h1>Blattwerk</h1>
    </div>

    <div class="field">
      <span class="field-label" id="tpl-label">Vorlage</span>
      <div class="tpl-cards" id="tpl-cards" role="radiogroup" aria-labelledby="tpl-label"></div>
    </div>
    <p class="tpl-desc" id="tpl-desc"></p>

    <div id="opts"><!-- per-template options render here --></div>

    <hr class="divider">

    <div class="deko-bar">
      <label class="deko-check"><input type="checkbox" id="deko-on"> Schmuck</label>
      <button class="btn-dice" id="dice" title="Schmuck und Aufgaben neu würfeln">🎲 Neu würfeln</button>
    </div>

    <hr class="divider">

    <div class="field">
      <label for="pages">Anzahl Blätter</label>
      <input type="number" id="pages" min="1" max="20">
      <div class="field-hint" id="pages-hint"></div>
    </div>

    <button class="btn-print" id="print">Drucken</button>
    <p class="hint">Tipp: Im Druckdialog „Kopf- und Fußzeilen“ ausschalten, dann bleibt das Blatt sauber.</p>
    <div class="warn" id="warn">Passt nicht auf eine Seite — weniger Zeilen oder kleinere Kästchen wählen.</div>
  </aside>

  <main class="stage">
    <div class="sheet-scaler" id="scaler"><!-- rendered worksheets --></div>
  </main>

</div>

<script>
"use strict";

/* ============ geometry (mm) ============
   A4 is the default; a Vorlage may declare its own `page: { w, h, pad }`. PRINT_RESERVE
   is the band iOS AirPrint stamps its own footer into — it applies per PHYSICAL page, so
   it is subtracted from whatever paper size the Vorlage prints on. */
const PAGE = { w: 210, h: 297, pad: 12 };
const PRINT_RESERVE = 12;
function pageOf(tpl) { return tpl.page || PAGE; }
/* `twoUp` = two cards side by side on one physical page. The carrier is exactly two
   cards wide, so the cards tile it without a gap and the cut line is their shared edge. */
function cardsPerPage(tpl) { return tpl.twoUp ? 2 : 1; }
function paperOf(tpl) {
  const p = pageOf(tpl);
  return { w: p.w * cardsPerPage(tpl), h: p.h };
}
function ctxOf(tpl) {
  const p = pageOf(tpl);
  return { widthMm: p.w - 2 * p.pad, heightMm: p.h - PRINT_RESERVE - 2 * p.pad };
}

/* ============ Schmuck (decoration layer) ============
   Shell-owned, template-agnostic. A seeded roll picks one of four
   hand-designed footer patterns (Wiese, Girlande, Ecke, Streu) and fills
   its slots from the motif pool; sometimes one tiny motif joins the title.
   Same seed → same sheet. The decoration yields to the exercise —
   it can never push content to page 2 or trigger the overflow warning. */

const INK = "#26303A";
const PASTELS = (() => {
  const css = getComputedStyle(document.documentElement);
  return {
    green:  css.getPropertyValue("--deko-green").trim(),
    blue:   css.getPropertyValue("--deko-blue").trim(),
    yellow: css.getPropertyValue("--deko-yellow").trim(),
  };
})();

/* deterministic PRNG — same seed, same decoration */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const S = (sw) => `stroke="${INK}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"`;

/* motif pool — 24×24 boxes, sticker look: pastel fill + ink outline */
const MOTIFS = [
  { id: "blatt", fills: ["green"], draw: (f, sw) =>
      `<path d="M12 2.5 C18.5 7 19.5 15 12 21.5 C4.5 15 5.5 7 12 2.5 Z" fill="${f}" ${S(sw)}/>` +
      `<path d="M12 6.5 V18" fill="none" ${S(sw)}/>` },
  { id: "sproessling", fills: ["green"], draw: (f, sw) =>
      `<path d="M12 21.5 V10.5" fill="none" ${S(sw)}/>` +
      `<path d="M12 10.5 C6.5 10.5 3.8 6.2 4.8 2.5 C10 3.5 12 6.8 12 10.5 Z" fill="${f}" ${S(sw)}/>` +
      `<path d="M12 13 C16.2 13 18.3 9.7 17.6 6.8 C13.6 7.6 12 10 12 13 Z" fill="${f}" ${S(sw)}/>` },
  { id: "blume", fills: ["blue", "yellow"], draw: (f, sw) => {
      let p = "";
      for (let i = 0; i < 5; i++) {
        const a = -Math.PI / 2 + i * 2 * Math.PI / 5;
        p += `<circle cx="${(12 + 5.2 * Math.cos(a)).toFixed(2)}" cy="${(12 + 5.2 * Math.sin(a)).toFixed(2)}" r="3.7" fill="${f}" ${S(sw)}/>`;
      }
      return p + `<circle cx="12" cy="12" r="2.7" fill="${f === PASTELS.yellow ? PASTELS.blue : PASTELS.yellow}" ${S(sw)}/>`;
    } },
  { id: "tulpe", fills: ["yellow", "blue"], draw: (f, sw) =>
      `<path d="M12 14.5 V21.5" fill="none" ${S(sw)}/>` +
      `<path d="M12 18.6 C9.2 18.6 7.4 16.8 7 14.4" fill="none" ${S(sw)}/>` +
      `<path d="M6.8 4.2 V9.5 a5.2 5.2 0 0 0 10.4 0 V4.2 C15.5 6.6 13.9 6.7 12.9 4.6 Q12 6.6 11.1 4.6 C10.1 6.7 8.5 6.6 6.8 4.2 Z" fill="${f}" ${S(sw)}/>` },
  { id: "stern", fills: ["yellow"], draw: (f, sw) =>
      `<path d="M12 2 L14.9 8.3 L21.8 8.9 L16.6 13.5 L18.1 20.3 L12 16.7 L5.9 20.3 L7.4 13.5 L2.2 8.9 L9.1 8.3 Z" fill="${f}" ${S(sw)}/>` },
  { id: "sonne", fills: ["yellow"], draw: (f, sw) => {
      let d = "";
      for (let i = 0; i < 8; i++) {
        const a = i * Math.PI / 4 + Math.PI / 8;
        d += `M${(12 + 6.8 * Math.cos(a)).toFixed(1)} ${(12 + 6.8 * Math.sin(a)).toFixed(1)} L${(12 + 9.4 * Math.cos(a)).toFixed(1)} ${(12 + 9.4 * Math.sin(a)).toFixed(1)} `;
      }
      return `<circle cx="12" cy="12" r="4.8" fill="${f}" ${S(sw)}/><path d="${d}" fill="none" ${S(sw)}/>`;
    } },
  { id: "wolke", fills: ["blue"], draw: (f, sw) =>
      `<path d="M5 17.5 C2.6 17.5 1.5 15.8 1.5 14.2 C1.5 12.4 3 11.2 4.6 11.2 C4.9 8.1 7.4 6 10.3 6 C13 6 15.2 7.8 15.9 10.3 C18.4 10.3 20.5 11.9 20.5 14 C20.5 15.9 19 17.5 16.8 17.5 Z" fill="${f}" ${S(sw)}/>` },
  { id: "pilz", fills: ["yellow", "blue", "green"], draw: (f, sw) =>
      `<path d="M9.7 12.8 c.4 2.8 -.3 5.2 -1 6.9 a8.5 8.5 0 0 0 6.6 0 c-.7 -1.7 -1.4 -4.1 -1 -6.9 Z" fill="#FFFFFF" ${S(sw)}/>` +
      `<path d="M3.6 12.8 C3.6 7.2 7.4 3.4 12 3.4 s8.4 3.8 8.4 9.4 Z" fill="${f}" ${S(sw)}/>` +
      `<circle cx="8.3" cy="8.6" r="1.35" fill="#FFFFFF"/>` +
      `<circle cx="13.2" cy="6.4" r="1.1" fill="#FFFFFF"/>` +
      `<circle cx="15.9" cy="9.8" r="1.25" fill="#FFFFFF"/>` },
  { id: "schnecke", fills: ["yellow", "blue", "green"], draw: (f, sw) =>
      `<path d="M2.8 19.8 c0 -3.4 2.3 -5.6 4.9 -5.2" fill="none" ${S(sw)}/>` +
      `<path d="M5.4 14.9 L4.2 12.2 M7 14.6 L7.3 11.8" fill="none" ${S(sw)}/>` +
      `<circle cx="4.2" cy="11.9" r=".8" fill="${INK}"/><circle cx="7.4" cy="11.5" r=".8" fill="${INK}"/>` +
      `<circle cx="14.2" cy="14" r="5.8" fill="${f}" ${S(sw)}/>` +
      `<path d="M14.2 14 a2.3 2.3 0 0 1 2.3 2.3 A4.2 4.2 0 0 1 10 14.6" fill="none" ${S(sw)}/>` +
      `<path d="M2.8 19.8 H19.2" fill="none" ${S(sw)}/>` },
  { id: "stift", fills: ["yellow"], draw: (f, sw) =>
      `<path d="M3.8 20.2 L5.2 14.9 L16.1 4 A2.7 2.7 0 0 1 19.9 7.8 L9 18.7 L3.8 20.2 Z" fill="${f}" ${S(sw)}/>` +
      `<path d="M5.2 14.9 L9 18.7" fill="none" ${S(sw)}/>` +
      `<path d="M3.8 20.2 L4.4 17.9 L6.1 19.6 Z" fill="${INK}" ${S(sw)}/>` },
  { id: "herz", fills: ["yellow", "blue", "green"], draw: (f, sw) =>
      `<path d="M12 20.5 C5.2 15.5 3.6 10.9 6.2 8.2 a4.1 4.1 0 0 1 5.8 .2 a4.1 4.1 0 0 1 5.8 -.2 c2.6 2.7 1 7.3 -5.8 12.3 Z" fill="${f}" ${S(sw)}/>` },
  { id: "schmetterling", fills: ["yellow", "blue", "green"], draw: (f, sw) =>
      `<ellipse cx="6.6" cy="9.4" rx="4.1" ry="3.2" transform="rotate(-28 6.6 9.4)" fill="${f}" ${S(sw)}/>` +
      `<ellipse cx="17.4" cy="9.4" rx="4.1" ry="3.2" transform="rotate(28 17.4 9.4)" fill="${f}" ${S(sw)}/>` +
      `<ellipse cx="7.9" cy="15.8" rx="2.8" ry="2.3" transform="rotate(22 7.9 15.8)" fill="${f}" ${S(sw)}/>` +
      `<ellipse cx="16.1" cy="15.8" rx="2.8" ry="2.3" transform="rotate(-22 16.1 15.8)" fill="${f}" ${S(sw)}/>` +
      `<path d="M12 7.2 V18.8 M12 7.2 L9.6 3.8 M12 7.2 L14.4 3.8" fill="none" ${S(sw)}/>` +
      `<circle cx="9.4" cy="3.6" r=".8" fill="${INK}"/><circle cx="14.6" cy="3.6" r=".8" fill="${INK}"/>` },
];

function pick(rng, arr) { return arr[Math.floor(rng() * arr.length)]; }
function pickDistinct(rng, n) {
  const pool = MOTIFS.slice(), out = [];
  for (let i = 0; i < n && pool.length; i++) out.push(pool.splice(Math.floor(rng() * pool.length), 1)[0]);
  return out;
}
function motifMarkup(rng, m, sw) { return m.draw(PASTELS[pick(rng, m.fills)], sw); }
const clampMm = (v, min, max) => Math.min(max, Math.max(min, v));

/* place a motif in footer coords (mm); stroke stays ≈0.42 mm at any size */
function placed(rng, m, x, y, size, rot, anchor) {
  const s = size / 24;
  const sw = Math.round((0.42 / s) * 100) / 100;
  const tx = x - 12 * s;
  const ty = anchor === "bottom" ? y - 24 * s : y - 12 * s;
  return `<g transform="translate(${tx.toFixed(2)} ${ty.toFixed(2)}) scale(${s.toFixed(3)}) rotate(${rot.toFixed(1)} 12 12)">${motifMarkup(rng, m, sw)}</g>`;
}

/* the four layout patterns — composed randomness, no chaotic rolls */
function wiese(rng, W, H) {
  const gy = H - 1.2, k = H / 22;
  let d = `M2 ${gy}`;
  for (let x = 2; x < W - 4; x += 22.75) d += ` q 11.4 ${(rng() * 1.6 - 0.8).toFixed(2)} 22.75 0`;
  let out = `<path d="${d}" fill="none" ${S(0.4)}/>`;
  const n = 4 + Math.floor(rng() * 3);
  const slot = (W - 8) / n;
  const ms = pickDistinct(rng, n);
  for (let i = 0; i < n; i++) {
    const x = 4 + slot * i + slot * (0.25 + 0.5 * rng());
    out += placed(rng, ms[i], x, gy + 0.2, (9 + rng() * 4) * k, rng() * 14 - 7, "bottom");
  }
  return out;
}
function girlande(rng, W, H) {
  const x0 = 7, x1 = W - 7, cx = W / 2, cy = H + 3;
  let out = `<path d="M${x0} 3.2 Q ${cx} ${cy} ${x1} 3.2" fill="none" ${S(0.4)} stroke-dasharray="0.1 1.7"/>`;
  const n = 5 + Math.floor(rng() * 3);
  const ms = pickDistinct(rng, n);
  for (let i = 0; i < n; i++) {
    const t = (i + 0.5) / n, u = 1 - t;
    const x = u * u * x0 + 2 * u * t * cx + t * t * x1;
    const y = u * u * 3.2 + 2 * u * t * cy + t * t * 3.2;
    out += placed(rng, ms[i], x, y, (6 + rng() * 2.5) * (H / 22), rng() * 20 - 10, "center");
  }
  return out;
}
function ecke(rng, W, H) {
  const left = rng() < 0.5, gy = H - 1.2, k = H / 22, dir = left ? 1 : -1;
  let x = left ? 8 : W - 8;
  let out = "";
  const n = 3 + (rng() < 0.5 ? 1 : 0);
  const ms = pickDistinct(rng, n);
  let size = 13 * k;
  for (let i = 0; i < n; i++) {
    out += placed(rng, ms[i], x, gy + 0.2, size, rng() * 12 - 6, "bottom");
    x += dir * (size * 0.62 + 2);
    size *= 0.76;
  }
  return out;
}
function streu(rng, W, H) {
  let out = "";
  const ms = pickDistinct(rng, 3);
  for (let i = 0; i < 3; i++) {
    const x = clampMm(16 + i * ((W - 32) / 2) + (rng() * 26 - 13), 8, W - 8);
    const y = 5.5 + rng() * (H - 11);
    out += placed(rng, ms[i], x, y, (6 + rng() * 2) * (H / 22), rng() * 24 - 12, "center");
  }
  for (let i = 0; i < 4; i++) {
    const x = 6 + rng() * (W - 12), y = 3.5 + rng() * (H - 7);
    out += `<path transform="translate(${x.toFixed(1)} ${y.toFixed(1)})" d="M0 -1.7 L0.45 -0.45 L1.7 0 L0.45 0.45 L0 1.7 L-0.45 0.45 L-1.7 0 L-0.45 -0.45 Z" fill="${INK}"/>`;
  }
  return out;
}
const PATTERNS = [wiese, girlande, ecke, streu];

function renderDeko(sheet, rng, page) {
  if (!dekoOn) return;
  const rect = sheet.getBoundingClientRect();
  const pxPerMm = rect.width / page.w;
  const contentBottom = (sheet.lastElementChild.getBoundingClientRect().bottom - rect.top) / pxPerMm;
  const sheetMm = page.h - PRINT_RESERVE;        // the floored height, whatever the paper
  const footW = page.w - 2 * page.pad;

  // fixed draw order: the roll stays stable while the footer adapts to content
  const pattern = pick(rng, PATTERNS);
  const wantTitleMotif = rng() < 0.55;
  const titleLeft = rng() < 0.5;
  const titleMotif = pick(rng, MOTIFS);

  // the footer yields: full (22 mm) → compact (15 mm) → none
  let h = 0;
  if (contentBottom <= sheetMm - 21) h = 22;
  else if (contentBottom <= sheetMm - 14) h = 15;

  const layer = el("div", "deko");
  if (h) {
    layer.innerHTML =
      `<svg class="deko-footer" style="height:${h}mm" viewBox="0 0 ${footW} ${h}" xmlns="http://www.w3.org/2000/svg">` +
      pattern(rng, footW, h) + `</svg>`;
  }
  sheet.appendChild(layer);

  const title = sheet.querySelector(".sheet-title");
  if (wantTitleMotif && title) {
    const span = el("span", "deko-title-motif");
    span.innerHTML = `<svg width="7mm" height="7mm" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">${motifMarkup(rng, titleMotif, 1.6)}</svg>`;
    title[titleLeft ? "prepend" : "append"](span);
  }
}

/* ============ template registry ============
   A template is one declarative object:
     name / glyph / description — shown in the picker (glyph: short Blattschrift
                           sample of what the child practices, e.g. "123")
     options[]           — rendered generically by the shell
     random              — true if render draws from ctx.rng (keeps 🎲 enabled)
     render(opts, ctx)   — returns the sheet body as a DOM node
   ctx.rng is a seeded PRNG sharing the 🎲 roll with the Schmuck layer:
   same seed → same sheet, 🎲 re-rolls Aufgaben and Schmuck together.
   The shell owns the header (Name / Datum / Titel) and printing.
   Adding a worksheet type = adding one entry here.               */
/* ============ lesen — Fibel-Lehrgang · Graphem-Tokenizer · Satzkorpus ============
   LESEN-START — pure data + pure functions, no DOM. The headless corpus lint reads
   this region straight out of index.html, so app and lint share one source of truth.

   Lehrgang: „Meine Fibel", Cornelsen 2022, Klasse 1, Buchstabenkurs.
   S. 64 is recorded as "Ö ö": the printed table lists "Ü ü" twice (64 + 66) and never
   introduces Ö at all — assumption D5 in seed_2026_09_18_lesen_fibel.               */
const FIBEL = [
  { page:   4, focus: "M m" },
  { page:   6, focus: "I i" },
  { page:   8, focus: "A a" },
  { page:  10, focus: "ist" },
  { page:  12, focus: "P p" },
  { page:  14, focus: "O o" },

/* Sichtwörter: introduced as whole words long before their letters ("ist" on S. 10,
   but S only on 34) — matched before any grapheme, else the early pages are unusable. */
const SIGHTWORDS = new Set(["ist", "ruft", "und", "sind"]);

const GRAPHEME_PAGE = {};   // "sch" → 60
const SIGHTWORD_PAGE = {};  // "ist" → 10
const PAGE_CHOICES = [];    // { value, label } — feeds the Fibel-Seite select

(function readFibel() {
  let prev = null;
  for (const p of FIBEL) {
    if (!p.focus) continue;                    // Lesetext-only page: unlocks nothing
    if (p.type !== "review") {
      const key = p.focus.split(" ")[0].toLowerCase();  // "Sch sch" → "sch", "Ei ei" → "ei"
      if (key === prev) continue;              // same grapheme across two pages (R r on 36 + 37)
      prev = key;
      if (SIGHTWORDS.has(key)) SIGHTWORD_PAGE[key] = p.page;
      else if (GRAPHEME_PAGE[key] === undefined) GRAPHEME_PAGE[key] = p.page;
    }
    PAGE_CHOICES.push({ value: String(p.page), label: "S. " + p.page + " — " + p.focus });
  }
})();

/* Longest match runs over the COMPLETE inventory and the page is checked afterwards.
   Tokenizing against the unlocked subset instead would let "sie" through as s+i+e long
   before "ie" (S. 48) is introduced — the child would be taught the wrong sound. */
const GRAPHEMES = Object.keys(GRAPHEME_PAGE).sort((a, b) => b.length - a.length);
const ONSET_ONLY = new Set(["st", "sp"]);   // the /ʃt/, /ʃp/ units — "ist", "Fenster" are s+t
const LESEN_ALPHABET = /^[a-zäöüß .,!?]+$/;  // D11: no page gates punctuation

function wordPage(word) {
  if (SIGHTWORD_PAGE[word] !== undefined) return SIGHTWORD_PAGE[word];
  let page = 0;
  for (let i = 0; i < word.length; ) {
    const g = GRAPHEMES.find((c) => (i === 0 || !ONSET_ONLY.has(c)) && word.startsWith(c, i));
    if (!g) return null;
    page = Math.max(page, GRAPHEME_PAGE[g]);
    i += g.length;
  }
  return page;
}

/* → earliest Fibel page the sentence is readable at, or null if it can never be read */
function minPage(sentence) {
  const s = sentence.toLowerCase();
  if (!LESEN_ALPHABET.test(s)) return null;   // stray character — the lint reports it
  let page = 0;
  for (const w of s.split(/[^a-zäöüß]+/)) {
    if (!w) continue;
    const p = wordPage(w);
    if (p === null) return null;
    page = Math.max(page, p);
  }
  return page;
}

/* Schriftgröße follows the Lehrgang: calm and large at the first letters, smaller once the
   child reads fluently. Linear between the anchors, flat outside them.
   The start is 18.75 pt — exactly what S. 48 already rendered. Since the curve has to fall
   monotonically, that makes everything up to S. 48 necessarily flat; from there it runs on
   unchanged. (Before: 26 pt at S. 12, which read as too heavy on the card.) */
const SIZE_ANCHORS = [[48, 18.75], [62, 17], [78, 15.5], [94, 14], [112, 13]];
const LESEN_ROWS = 10;       // Zeilen pro Karte — Groessenkappung und render() teilen sie
const ROW_EM = 1.35 + 0.7;   // .satz-list line-height + gap, both in em
const TITEL_MM = 24;         // room the shell's Titel block takes above the sentences
const PT_PER_MM = 72 / 25.4;
const LIST_INDENT_MM = 8;    // .satz-list padding-left
const AVG_CHAR_EM = 0.49;    // mean advance width of Blattschrift, measured over the corpus

/* The size the Lehrgang wants, clamped to what the paper can hold. */
function lesenPt(page, size, ctx) {
  const cap = ((ctx.heightMm - TITEL_MM) / (LESEN_ROWS * ROW_EM)) * PT_PER_MM;
  const want = size === "auto" ? autoSizePt(page) : { gross: 24, mittel: 18, klein: 14 }[size];
  return Math.min(want, cap);
}

/* Every row must stay ONE line: a wrapped sentence turns 10 rows into 11 and pushes the
   card over. So the pool is additionally capped by how many characters fit at this size —
   which is also why the sentences grow with the Lehrgang all by themselves: later pages
   print smaller, and smaller type has room for more words. */
function lesenMaxChars(pt, ctx) {
  return Math.floor((ctx.widthMm - LIST_INDENT_MM) / ((pt / PT_PER_MM) * AVG_CHAR_EM));
}
function lesenFitting(page, pt, ctx) {
  const pool = lesenPool(page);
  const fits = pool.filter((s) => s.text.length <= lesenMaxChars(pt, ctx));
  return fits.length ? fits : pool;   // never hand back nothing
}
function autoSizePt(page) {
  if (page <= SIZE_ANCHORS[0][0]) return SIZE_ANCHORS[0][1];
  for (let i = 1; i < SIZE_ANCHORS.length; i++) {
    const [p0, s0] = SIZE_ANCHORS[i - 1], [p1, s1] = SIZE_ANCHORS[i];
    if (page <= p1) return s0 + (s1 - s0) * (page - p0) / (p1 - p0);
  }
  return SIZE_ANCHORS[SIZE_ANCHORS.length - 1][1];
}

const LESEN_SAETZE = LESEN_CORPUS.map((text) => ({ text, page: minPage(text) }));
function lesenPool(page) {
  return LESEN_SAETZE.filter((s) => s.page !== null && s.page <= page);
}

/* Editorial floor, not a computed one: below S. 20 the Lehrgang only yields sentences like
   „Mimi ist Mama." — grammatically fine, but not worth a reading card, and with two or three
   of them per page they just repeat. S. 20 („und") is where a card first reads like a card.
   Deliberately a constant and not a pool-size rule: adding a couple of early sentences some
   day should NOT silently re-open S. 14. */
const LESEN_MIN_PAGE = 20;
for (let i = PAGE_CHOICES.length - 1; i >= 0; i--) {
  const page = parseInt(PAGE_CHOICES[i].value, 10);
  if (page < LESEN_MIN_PAGE || !lesenPool(page).length) PAGE_CHOICES.splice(i, 1);
}

/* Die Rampe: der Pool wird nach Länge in 10 Bänder geteilt und aus jedem Band genau ein
   Satz gezogen. Ein reiner Zufallsgriff wäre kurz-lastig, weil der Korpus es ist — die
   Karte bekäme neun kurze Sätze und einen Ausreißer. Geschichtet ist die Steigerung
   strukturell garantiert statt erhofft: Bänder sind disjunkt (⇒ verschieden) und nach
   Länge geordnet (⇒ aufsteigend), beides by construction, nicht per Zufall. */
function drawRamp(pool, n, rng) {
  if (pool.length < n) return drawSaetze(pool, n, rng).sort(byLength);
  const sorted = pool.slice().sort(byLength);
  const out = [];
  for (let i = 0; i < n; i++) {
    const lo = Math.floor(i * sorted.length / n);
    const hi = Math.floor((i + 1) * sorted.length / n);
    out.push(sorted[lo + Math.floor(rng() * (hi - lo))]);
  }
  return out;
}
function byLength(a, b) {
  return a.text.length - b.text.length || (a.text < b.text ? -1 : a.text > b.text ? 1 : 0);
}

/* 10 Sätze aus dem Pool. Partieller Fisher–Yates → distinct by construction; if the
   pool is smaller than the sheet (the first Fibel pages), a fresh copy is appended and
   sentences repeat — deliberate, repetition is fine for a beginning reader (D7). */
function drawSaetze(pool, n, rng) {
  if (!pool.length) return [];
  const bag = pool.slice();
  const out = [];
  for (let i = 0; out.length < n; i++) {
    if (i >= bag.length) bag.push(...pool);
    const j = i + Math.floor(rng() * (bag.length - i));
    [bag[i], bag[j]] = [bag[j], bag[i]];
    out.push(bag[i]);
  }
  return out;
}
/* LESEN-END */

/* ============ Sudoku — seeded Generator mit Eindeutigkeits-Garantie ============
   SUDOKU-START — reine Daten + reine Funktionen, kein DOM.
   n = 4 (2×2-Blöcke, Ziffern 1–4) oder 9 (3×3-Blöcke, Ziffern 1–9).
   Ein Gitter ist ein Int8Array der Länge n·n, 0 = leere Zelle.

     sdkFull   — würfelt eine vollständige, gültige Lösung
     sdkLogic  — menschen-analoger Solver; nutzt NUR die Techniken einer Stufe
     sdkMake   — gräbt Löcher, solange sdkLogic das Rätsel noch löst

   Der Kern der Garantie: sdkLogic rät nie. Ein Rätsel, das es löst, ist damit
   zwingend eindeutig lösbar — die Stufenprüfung IST der Eindeutigkeitsbeweis.
   sdkCount läuft am Ende trotzdem einmal als Assertion.                        */

/* Stufen je Gittergröße. `tier` = erlaubte Technik (1 Naked Single, 2 + Hidden Single,
   3 + Locked Candidates / Naked Pair), `givens` = Untergrenze vorgegebener Zahlen.

   Beim 4×4 ist die Technik-Leiter nachweislich degeneriert: minimal gegraben landet ein
   4×4 bei 4–5 Givens und braucht in 0 von 300 Fällen einen Hidden Single. Dort IST die
   Schwierigkeit die Zahl der Lücken — deshalb beide Stufen auf tier 1, getrennt nur über
   `givens`. „Schwer" gibt es beim 4×4 folgerichtig nicht (G2).                        */

  4: { leicht: { tier: 1, givens: 8 },  mittel: { tier: 1, givens: 5 } },
  9: { leicht: { tier: 1, givens: 36 }, mittel: { tier: 2, givens: 30 }, schwer: { tier: 3, givens: 24 } },
};
const SDK_STARS = { leicht: 1, mittel: 2, schwer: 3 };
const SDK_RETRIES = 12;

const sdkBits = (m) => { let c = 0; while (m) { m &= m - 1; c++; } return c; };
const sdkFirst = (m) => 31 - Math.clz32(m & -m);     // 0-basierter Index des gesetzten Bits

const sdkCache = {};
function sdkUnits(n) {

  const b = Math.round(Math.sqrt(n));                 // 2 → 4×4, 3 → 9×9
  const rows = [], cols = [], boxes = [];
  for (let r = 0; r < n; r++) rows.push([...Array(n)].map((_, c) => r * n + c));
  for (let c = 0; c < n; c++) cols.push([...Array(n)].map((_, r) => r * n + c));
  for (let br = 0; br < n; br += b)
    for (let bc = 0; bc < n; bc += b) {
      const u = [];
      for (let r = br; r < br + b; r++) for (let c = bc; c < bc + b; c++) u.push(r * n + c);
      boxes.push(u);
    }
  const units = [...rows, ...cols, ...boxes];
  const peers = Array.from({ length: n * n }, () => new Set());
  for (const u of units) for (const i of u) for (const j of u) if (i !== j) peers[i].add(j);
  const boxOf = new Int8Array(n * n);
  for (let i = 0; i < n * n; i++) boxOf[i] = Math.floor(i / n / b) * b + Math.floor((i % n) / b);
  return (sdkCache[n] = { b, rows, cols, boxes, units, boxOf, peers: peers.map((s) => [...s]) });
}

/* vollständige Lösung — Backtracking mit gewürfelter Ziffernreihenfolge */
function sdkFull(rng, n) {
  const { peers } = sdkUnits(n);
  const full = (1 << n) - 1;
  const g = new Int8Array(n * n);
  const order = new Int8Array(n);
  const fill = (i) => {
    if (i === n * n) return true;
    let used = 0;
    for (const p of peers[i]) if (g[p]) used |= 1 << (g[p] - 1);
    const mask = ~used & full;
    for (let k = 0; k < n; k++) order[k] = k + 1;
    for (let k = 0; k < n; k++) {
      const j = k + Math.floor(rng() * (n - k));
      const t = order[k]; order[k] = order[j]; order[j] = t;
    }
    for (let k = 0; k < n; k++) {
      const d = order[k];
      if (!(mask & (1 << (d - 1)))) continue;
      g[i] = d;
      if (fill(i + 1)) return true;
    }
    g[i] = 0;
    return false;
  };
  fill(0);
  return g;
}

/* zählt Lösungen bis `limit` (MRV-Backtracking) — nur als Schluss-Assertion */
function sdkCount(grid, n, limit) {
  const { peers } = sdkUnits(n);
  const full = (1 << n) - 1;
  const g = Int8Array.from(grid);
  let count = 0;
  const rec = () => {
    let best = -1, bestMask = 0, bestCnt = n + 1;
    for (let i = 0; i < n * n; i++) {
      if (g[i]) continue;
      let used = 0;
      for (const p of peers[i]) if (g[p]) used |= 1 << (g[p] - 1);
      const mask = ~used & full;
      const c = sdkBits(mask);
      if (c === 0) return;
      if (c < bestCnt) { best = i; bestCnt = c; bestMask = mask; if (c === 1) break; }
    }
    if (best === -1) { count++; return; }
    for (let d = 1; d <= n; d++) {
      if (!(bestMask & (1 << (d - 1)))) continue;
      g[best] = d; rec(); g[best] = 0;
      if (count >= limit) return;
    }
  };
  rec();
  return count;
}

/* menschen-analoger Solver. tier 1 = Naked Single, 2 = + Hidden Single,
   3 = + Locked Candidates / Naked Pair. Rät nie — false heißt "reicht nicht". */
function sdkLogic(grid, n, tier) {
  const { units, boxes, rows, cols, boxOf, peers } = sdkUnits(n);
  const full = (1 << n) - 1;
  const g = Int8Array.from(grid);
  const cand = new Int32Array(n * n);
  let empty = 0;
  for (let i = 0; i < n * n; i++) {
    if (g[i]) { cand[i] = 0; continue; }
    empty++;
    let used = 0;
    for (const p of peers[i]) if (g[p]) used |= 1 << (g[p] - 1);
    cand[i] = ~used & full;
  }
  const place = (i, d) => {
    g[i] = d; cand[i] = 0; empty--;
    const bit = 1 << (d - 1);
    for (const p of peers[i]) cand[p] &= ~bit;
  };
  for (;;) {
    for (let i = 0; i < n * n; i++) if (!g[i] && cand[i] === 0) return false;  // Widerspruch
    if (empty === 0) return true;
    let progress = false;

    for (let i = 0; i < n * n; i++)                                   // Naked Single
      if (!g[i] && sdkBits(cand[i]) === 1) { place(i, sdkFirst(cand[i]) + 1); progress = true; }
    if (progress) continue;

    if (tier >= 2)                                                    // Hidden Single
      for (const u of units)
        for (let d = 1; d <= n; d++) {
          const bit = 1 << (d - 1);
          let spot = -1, cnt = 0, taken = false;
          for (const i of u) {
            if (g[i] === d) { taken = true; break; }
            if (!g[i] && (cand[i] & bit)) { spot = i; cnt++; }
          }
          if (!taken && cnt === 1) { place(spot, d); progress = true; }
        }
    if (progress) continue;

    if (tier >= 3) {
      const strip = (cells, bit, keep) => {                           // Kandidat streichen
        for (const i of cells) {
          if (g[i] || keep.has(i) || !(cand[i] & bit)) continue;
          cand[i] &= ~bit; progress = true;
        }
      };
      for (let d = 1; d <= n; d++) {                                  // Locked Candidates
        const bit = 1 << (d - 1);
        for (const box of boxes) {                                    // pointing: Box → Reihe/Spalte
          const spots = box.filter((i) => !g[i] && (cand[i] & bit));
          if (!spots.length || box.some((i) => g[i] === d)) continue;
          const r = Math.floor(spots[0] / n), c = spots[0] % n;
          if (spots.every((i) => Math.floor(i / n) === r)) strip(rows[r], bit, new Set(spots));
          if (spots.every((i) => i % n === c)) strip(cols[c], bit, new Set(spots));
        }
        for (const line of [...rows, ...cols]) {                      // claiming: Reihe/Spalte → Box
          const spots = line.filter((i) => !g[i] && (cand[i] & bit));
          if (!spots.length || line.some((i) => g[i] === d)) continue;
          const bx = boxOf[spots[0]];
          if (spots.every((i) => boxOf[i] === bx)) strip(boxes[bx], bit, new Set(spots));
        }
      }
      if (!progress)
        for (const u of units) {                                      // Naked Pair
          const pairs = u.filter((i) => !g[i] && sdkBits(cand[i]) === 2);
          for (let a = 0; a < pairs.length; a++)
            for (let b2 = a + 1; b2 < pairs.length; b2++) {
              if (cand[pairs[a]] !== cand[pairs[b2]]) continue;
              const mask = cand[pairs[a]], keep = new Set([pairs[a], pairs[b2]]);
              for (const i of u) {
                if (g[i] || keep.has(i) || !(cand[i] & mask)) continue;
                cand[i] &= ~mask; progress = true;
              }
            }
        }
    }
    if (!progress) return false;
  }
}

/* ein Rätsel bauen: Löcher graben, solange die Stufe es noch ohne Raten löst.
   Eine Stufe mit echter Technik (tier > 1) muss mit der schwächeren Technik
   SCHEITERN, sonst wäre sie nur ein leichtes mit weniger Zahlen. Reicht das
   Budget nicht, wird still eine Stufe tiefer gegangen statt hängen zu bleiben. */
function sdkMake(rng, n, level) {
  const names = Object.keys(SDK_LEVELS[n]);
  if (!SDK_LEVELS[n][level]) level = names[names.length - 1];   // z.B. „schwer" beim 4×4
  const { tier, givens: floor } = SDK_LEVELS[n][level];
  for (let attempt = 0; attempt < SDK_RETRIES; attempt++) {
    const solution = sdkFull(rng, n);
    const puzzle = Int8Array.from(solution);
    const order = [...Array(n * n).keys()];
    for (let k = 0; k < order.length; k++) {
      const j = k + Math.floor(rng() * (order.length - k));
      [order[k], order[j]] = [order[j], order[k]];
    }
    let givens = n * n;
    for (const i of order) {
      if (givens <= floor) break;
      const save = puzzle[i];
      puzzle[i] = 0;
      if (sdkLogic(puzzle, n, tier)) givens--;
      else puzzle[i] = save;
    }
    if (tier > 1 && sdkLogic(puzzle, n, tier - 1)) continue;   // zu leicht für die Stufe
    if (sdkCount(puzzle, n, 2) !== 1) continue;                // darf nie eintreten
    return { puzzle, solution, level, givens };
  }
  // Budget erschöpft — eine Stufe tiefer statt hängen bleiben (G9). Die unterste Stufe
  // hat keine Ausschlussprüfung und kann deshalb nicht scheitern.
  return sdkMake(rng, n, names[names.indexOf(level) - 1]);
}

   loadOpts() prefers a saved title over the default, so a Gerät that had these
   Vorlagen open once would keep printing the old heading. Drop the saved title
   only when it is exactly the old default - a self-typed title survives. */
for (const [id, alt] of [["mathe0", "Vorschule Mathe 0"], ["mathe1", "Vorschule Mathe I"]]) {
  const k = "blattwerk:opts:" + id;
  const raw = localStorage.getItem(k);
  if (!raw) continue;
  try {
    const o = JSON.parse(raw);
    if (o.title !== alt) continue;
    delete o.title;
    localStorage.setItem(k, JSON.stringify(o));
  } catch { /* corrupt entry - loadOpts falls back to the defaults anyway */ }
}

if (!Number.isFinite(dekoSeed)) rollDeko();
function rollDeko() {
  dekoSeed = Math.floor(Math.random() * 4294967296);
  localStorage.setItem("blattwerk:dekoSeed", dekoSeed);
}

/* Anzahl Blätter — shell-owned like Schmuck, applies to every Vorlage */
let pageCount = parseInt(localStorage.getItem("blattwerk:pages"), 10) || 1;

/* An option's `default` may be a function of the other options (e.g. the Lesen title
   follows the Fibel-Seite). It keeps following until the user types in that field;
   clearing the field hands control back to the automatic value. */
let dirtyOpts = new Set();
function loadDirty(tplId) {
  dirtyOpts = new Set(JSON.parse(localStorage.getItem("blattwerk:dirty:" + tplId) || "[]"));
}
function saveDirty(tplId) {
  localStorage.setItem("blattwerk:dirty:" + tplId, JSON.stringify([...dirtyOpts]));
}

function loadOpts(tplId) {
  const tpl = TEMPLATES[tplId];
  const saved = JSON.parse(localStorage.getItem("blattwerk:opts:" + tplId) || "{}");
  const opts = {};
  // literals first — a computed default may read the others
  for (const o of tpl.options) {
    if (typeof o.default === "function") continue;
    opts[o.key] = saved[o.key] !== undefined ? saved[o.key] : o.default;
  }
  for (const o of tpl.options) {
    if (typeof o.default !== "function") continue;
    opts[o.key] = dirtyOpts.has(o.key) && saved[o.key] !== undefined ? saved[o.key] : o.default(opts);
  }
  return opts;
}

/* re-run the computed defaults after any option change, and mirror them into the form */
function syncDefaults(tpl, opts) {
  for (const o of tpl.options) {
    if (typeof o.default !== "function" || dirtyOpts.has(o.key)) continue;
    const v = o.default(opts);
    if (opts[o.key] === v) continue;
    opts[o.key] = v;
    const input = $("opt-" + o.key);
    if (input) input.value = v;
  }
}

/* a hint is an optional per-option note under the field (e.g. "pool too small") */
function updateHints(tpl, opts) {
  for (const o of tpl.options) {
    if (!o.hint) continue;
    const node = $("hint-" + o.key);
    if (!node) continue;
    const text = o.hint(opts);
    node.textContent = text || "";
    node.classList.toggle("show", !!text);
  }
}
/* a select may gate individual choices (e.g. "schwer" only exists on the 9×9 grid).
   Gated choices are greyed out, and a value that just became unavailable falls back to
   the first one still allowed — third hook next to syncDefaults / updateHints. */
function syncChoices(tpl, opts) {
  for (const o of tpl.options) {
    if (!o.disabled) continue;
    const input = $("opt-" + o.key);
    if (!input) continue;
    // ein Toggle hat keine Auswahlliste: disabled(opts) sperrt den Schalter selbst
    if (o.type === "toggle") { input.disabled = o.disabled(opts); continue; }
    const open = [];
    for (const oe of input.options) {
      oe.disabled = o.disabled(opts, oe.value);
      if (!oe.disabled) open.push(oe.value);
    }
    if (open.length && o.disabled(opts, opts[o.key])) {
      // auf die naechstniedrigere noch erlaubte Wahl klemmen, nicht stumpf auf die erste:
      // 9x9/schwer -> 4x4 landet auf mittel, nicht auf leicht
      const was = [...input.options].findIndex((oe) => oe.value === opts[o.key]);
      const below = [...input.options].slice(0, was).filter((oe) => !oe.disabled).pop();
      const next = below ? below.value : open[0];
      opts[o.key] = next;
      input.value = next;
    }
  }
}
function saveOpts(tplId, opts) {
  localStorage.setItem("blattwerk:tpl", tplId);
  localStorage.setItem("blattwerk:opts:" + tplId, JSON.stringify(opts));
}

/* pastel card fills — passive, cycled per card; yellow stays reserved for actions */
const CARD_FILLS = ["var(--deko-yellow)", "var(--deko-blue)", "var(--deko-green)"];

function buildPicker() {
  const box = $("tpl-cards");
  box.innerHTML = "";
  Object.entries(TEMPLATES).forEach(([id, t], i) => {
    const input = el("input");
    input.type = "radio";
    input.name = "tpl";
    input.id = "tpl-" + id;
    input.checked = id === activeTpl;
    input.addEventListener("change", () => { activeTpl = id; rollDeko(); loadDirty(id); buildOptions(); updateDice(); update(); });

    const card = el("label", "tpl-card");
    card.htmlFor = input.id;
    card.style.setProperty("--card-fill", CARD_FILLS[i % CARD_FILLS.length]);
    const glyph = el("span", "tpl-glyph");
    glyph.textContent = t.glyph || t.name.slice(0, 2);
    const name = el("span", "tpl-name");
    name.textContent = t.name;
    card.append(glyph, name);

    box.append(input, card);
  });
}

function buildOptions() {
  const tpl = TEMPLATES[activeTpl];
  $("tpl-desc").textContent = tpl.description;
  const box = $("opts");
  box.innerHTML = "";
  const opts = loadOpts(activeTpl);

  let numberRow = null; // pair up consecutive number fields side by side
  let toggleRow = null; // consecutive toggles share one row under one group label
  for (const o of tpl.options) {
    if (o.type === "toggle") {
      numberRow = null;
      if (!toggleRow) {
        const group = el("div", "field");
        const groupLabel = el("span", "field-label");
        groupLabel.textContent = o.group || "";
        toggleRow = el("div", "toggle-row");
        group.append(groupLabel, toggleRow);
        box.appendChild(group);
      }
      const check = el("input");
      check.type = "checkbox";
      check.checked = !!opts[o.key];
      check.id = "opt-" + o.key;
      check.dataset.key = o.key;
      check.dataset.type = o.type;
      // der Chip zeigt nur die Schriftprobe — der Reader braucht das ausgeschriebene Wort
      check.setAttribute("aria-label", o.aria || o.label);
      check.addEventListener("change", update);
      const chip = el("span", "toggle-chip");
      chip.textContent = o.label;
      const wrap = el("label", "toggle");
      wrap.append(check, chip);
      toggleRow.appendChild(wrap);
      continue;
    }
    toggleRow = null;
    const field = el("div", "field");
    const label = el("label");
    label.textContent = o.label;
    label.htmlFor = "opt-" + o.key;
    field.appendChild(label);

    let input;
    if (o.type === "select") {
      input = el("select");
      for (const c of o.choices) {
        const oe = el("option");
        oe.value = c.value; oe.textContent = c.label;
        if (o.disabled) oe.disabled = o.disabled(opts, c.value);
        input.appendChild(oe);
      }
      input.value = opts[o.key];
    } else {
      input = el("input");
      input.type = o.type;
      if (o.min !== undefined) input.min = o.min;
      if (o.max !== undefined) input.max = o.max;
      input.value = opts[o.key];
    }
    input.id = "opt-" + o.key;
    input.dataset.key = o.key;
    input.dataset.type = o.type;
    input.addEventListener("input", () => {
      if (typeof o.default === "function") {
        // typing takes the field over; emptying it gives the automatic value back
        if (input.value.trim() === "") dirtyOpts.delete(o.key);
        else dirtyOpts.add(o.key);
        saveDirty(activeTpl);
      }
      update();
    });
    field.appendChild(input);

    if (o.hint) {
      const hint = el("div", "field-hint");
      hint.id = "hint-" + o.key;
      input.setAttribute("aria-describedby", hint.id);   // Reader liest den Hinweis mit
      field.appendChild(hint);
    }

    if (o.type === "number") {
      if (!numberRow) { numberRow = el("div", "field-row"); box.appendChild(numberRow); }
      numberRow.appendChild(field);
    } else {
      numberRow = null;
      box.appendChild(field);
    }
  }
}

function readOpts() {
  const opts = {};
  for (const input of $("opts").querySelectorAll("[data-key]")) {
    opts[input.dataset.key] =
      input.dataset.type === "toggle" ? input.checked :
      input.dataset.type === "number" ? (parseInt(input.value, 10) || 0) : input.value;
  }
  return opts;
}

function buildSheet(tpl, opts, templateRng) {
  const sheet = el("div", "sheet");
  const p = pageOf(tpl);
  sheet.style.setProperty("--sheet-w", p.w + "mm");
  sheet.style.setProperty("--sheet-h", (p.h - PRINT_RESERVE) + "mm");
  sheet.style.setProperty("--sheet-pad", p.pad + "mm");

  // shell-owned header: Name (left) · Datum (right). A Vorlage that is read, not
  // written on, opts out with `header: false` — nothing to sign.
  if (tpl.header !== false) {
    const head = el("div", "sheet-head");
    const name = el("div", "write-line write-name");
    name.appendChild(Object.assign(el("span"), { textContent: "Name:" }));
    name.appendChild(el("span", "rule"));
    const date = el("div", "write-line write-date");
    date.appendChild(Object.assign(el("span"), { textContent: "Datum:" }));
    date.appendChild(el("span", "rule"));
    head.append(name, date);
    sheet.appendChild(head);
  }

  if (opts.title) {
    const title = el("div", "sheet-title");
    title.textContent = opts.title;
    sheet.appendChild(title);
  }

  sheet.appendChild(tpl.render(opts, { ...ctxOf(tpl), rng: templateRng }));
  return sheet;
}

function renderSheets() {
  const tpl = TEMPLATES[activeTpl];
  const opts = readOpts();
  // @page cannot be scoped to an element, so the rule itself is rewritten per Vorlage
  const paper = paperOf(tpl);
  $("page-rule").textContent = `@page { size: ${paper.w}mm ${paper.h}mm; margin: 0; }`;
  syncDefaults(tpl, opts);
  syncChoices(tpl, opts);
  updateHints(tpl, opts);
  saveOpts(activeTpl, opts);

  const scaler = $("scaler");
  scaler.innerHTML = "";

  // one meta stream draws a distinct sub-seed per CARD, so the same dekoSeed +
  // pageCount always reproduces the identical set; XOR still keeps each card's
  // template stream distinct from its own Schmuck stream (per-sheet rule)
  const metaRng = mulberry32(dekoSeed);
  const perPage = cardsPerPage(tpl);
  const sheets = [];
  for (let i = 0; i < pageCount; i++) {
    // the carrier goes into the DOM first: renderDeko measures live layout, so a card
    // must already be attached to its final parent before it can be decorated
    let host = scaler;
    if (perPage > 1) {
      host = el("div", "carrier");
      host.style.width = paper.w + "mm";
      host.style.height = paper.h + "mm";
      scaler.appendChild(host);
    }
    for (let k = 0; k < perPage; k++) {
      const cardSeed = Math.floor(metaRng() * 4294967296);
      const sheet = buildSheet(tpl, opts, mulberry32(cardSeed ^ 0x9E3779B9));
      host.appendChild(sheet);
      renderDeko(sheet, mulberry32(cardSeed), pageOf(tpl));
      sheets.push(sheet);
    }
    if (perPage > 1) host.appendChild(el("div", "cut-line"));
  }
  $("pages-hint").textContent = perPage > 1
    ? `${pageCount} Bogen A4 quer = ${pageCount * perPage} Karten zum Auseinanderschneiden`
    : "";
  $("pages-hint").classList.toggle("show", perPage > 1);

  // screen-only guard: does every page still fit one A4 page?
  // sheets grow with their content (min-height), so compare against fixed A4 height
  const a4h = parseFloat(getComputedStyle(sheets[0]).minHeight);
  $("warn").classList.toggle("show", sheets.some((s) => s.offsetHeight > a4h + 1));
}

/* true-size preview, scaled down only when the window is narrower than A4;
   stacked pages scale together so the on-screen preview matches print exactly */
function fitPreview() {
  const stage = document.querySelector(".stage");
  const scaler = $("scaler");
  const units = scaler.children;              // .sheet, or .carrier when two-up
  const pagePx = units[0].offsetWidth;
  const scale = Math.min(1, stage.clientWidth / pagePx);
  scaler.style.transform = "scale(" + scale + ")";
  const first = units[0].getBoundingClientRect();
  const last = units[units.length - 1].getBoundingClientRect();
  scaler.style.height = ((last.bottom - first.top) * scale) + "px";
}

function update() { renderSheets(); fitPreview(); }

/* 🎲 also re-rolls random templates, so it only disables
   when neither Schmuck nor the active template uses the roll */
function updateDice() { $("dice").disabled = !dekoOn && !TEMPLATES[activeTpl].random; }

buildPicker();
loadDirty(activeTpl);
buildOptions();
$("deko-on").checked = dekoOn;
$("pages").value = pageCount;
updateDice();
update();
window.addEventListener("resize", fitPreview);
$("print").addEventListener("click", () => window.print());
$("dice").addEventListener("click", () => {
  rollDeko();
  update();
  const d = $("dice");
  d.classList.remove("rolling");
  void d.offsetWidth; // restart the roll animation on rapid clicks
  d.classList.add("rolling");
});
$("deko-on").addEventListener("change", (e) => {
  dekoOn = e.target.checked;
  localStorage.setItem("blattwerk:deko", dekoOn ? "1" : "0");
  updateDice();
  update();
});
$("pages").addEventListener("input", () => {
  pageCount = parseInt($("pages").value, 10) || 1;
  localStorage.setItem("blattwerk:pages", pageCount);
  update();
});
</script>

</body>
</html>
